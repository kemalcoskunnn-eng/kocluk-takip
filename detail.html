<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Öğrenci Detayı</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div><a class="back-link" href="coach.html">← Koç paneli</a><span class="eyebrow">Öğrenci detayı</span><h1 id="detailTitle">Öğrenci</h1><p class="muted">Net, trend, ders bazlı gelişim ve tüm deneme geçmişi.</p></div>
    <button class="secondary" onclick="signOut()">Çıkış</button>
  </header>
  <div id="detailSummary" class="student-overview"></div>
  <div id="trendCards" class="trend-cards"></div>
  <div class="chart-grid">
    <div class="card chart-card"><div class="card-head"><div><span class="eyebrow blue">TYT</span><h2>TYT toplam net gelişimi</h2></div><span class="scale-note">120 net</span></div><div class="chart-wrap student-chart-wrap"><canvas id="detailTytChart"></canvas></div></div>
    <div class="card chart-card"><div class="card-head"><div><span class="eyebrow amber">AYT</span><h2>AYT toplam net gelişimi</h2></div><span class="scale-note">80 net</span></div><div class="chart-wrap student-chart-wrap"><canvas id="detailAytChart"></canvas></div></div>
  </div>
  <div class="chart-grid">
    <div class="card chart-card"><div class="card-head"><div><span class="eyebrow blue">Ders bazlı</span><h2>TYT ders gelişimi</h2></div></div><div class="chart-wrap subject-chart-wrap"><canvas id="detailTytSubjects"></canvas></div></div>
    <div class="card chart-card"><div class="card-head"><div><span class="eyebrow amber">Ders bazlı</span><h2>AYT ders gelişimi</h2></div></div><div class="chart-wrap subject-chart-wrap"><canvas id="detailAytSubjects"></canvas></div></div>
  </div>
  <div class="card">
    <div class="card-head"><div><span class="eyebrow">Geçmiş</span><h2>Tüm denemeler</h2></div><span id="detailExamCount" class="pill">0 kayıt</span></div>
    <div class="table-wrap"><table><thead><tr><th>Tarih</th><th>Tür</th><th>Deneme</th><th>Toplam</th><th>Önceki +/-</th><th>Not</th></tr></thead><tbody id="detailRows"></tbody></table></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="config.js"></script><script src="app.js"></script><script src="detail.js"></script>
</body></html>
